name: Deploy Dev

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  # Must at least match what the ci-gate job requests when calling
  # ci-full.yml as a reusable workflow — a caller's permissions cap what
  # the callee can be granted, and GitHub rejects the whole workflow file
  # otherwise ("is only allowed 'checks: none, ...'").
  pull-requests: write
  security-events: write
  checks: write

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci-full.yml
    secrets: inherit

  migrate:
    name: Apply Migrations → Dev
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: development
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required secrets
        id: check
        # The `secrets` context can't be used in a job-level `if:` (GitHub
        # rejects the whole workflow file as invalid) — so gate every later
        # step (and the downstream `deploy` job, via this job's output) on
        # this step's output instead. No-op (not a failure) until Supabase
        # secrets are configured — see PR #18's description for the list.
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not configured — skipping dev migrations/functions deploy (expected until secrets are set up, see PR #18)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Supabase CLI
        if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Link Supabase project
        if: steps.check.outputs.configured == 'true'
        run: supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        if: steps.check.outputs.configured == 'true'
        run: supabase db push --password "${{ secrets.SUPABASE_DEV_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        if: steps.check.outputs.configured == 'true'
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    needs: migrate
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          if [ "${{ needs.migrate.outputs.configured }}" != "true" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not configured (or migrations were skipped) — skipping dev deploy (expected until secrets are set up, see PR #18)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        if: steps.check.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel dev environment
        if: steps.check.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for dev
        if: steps.check.outputs.configured == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

      - name: Deploy to dev
        if: steps.check.outputs.configured == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test — health check
        if: steps.check.outputs.configured == 'true'
        run: |
          sleep 10
          curl --fail --silent "${{ steps.deploy.outputs.url }}/api/health" \
            || (echo "::error::Health check failed for dev deploy" && exit 1)
