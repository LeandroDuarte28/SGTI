name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # FASE 1 — Gate: CI must pass before any production step runs
  # ───────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci-full.yml
    secrets: inherit

  # ───────────────────────────────────────────────────────────────────────
  # FASE 2 — Migrations (paused for manual approval if the `production`
  # GitHub Environment has required reviewers configured)
  # ───────────────────────────────────────────────────────────────────────
  migrate:
    name: Apply Migrations → Production
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: production
    # No-op (not a failure) until Supabase secrets are configured — see
    # Docs/72_GITHUB_ACTIONS.md and PR #18's description for the full list.
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    outputs:
      has_migrations: ${{ steps.migration-check.outputs.has_migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for new migrations
        id: migration-check
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations/ | grep -q .; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New migration(s) detected for production:"
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations/
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        if: steps.migration-check.outputs.has_migrations == 'true'
        run: supabase db push --password "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Record migration in audit log
        if: steps.migration-check.outputs.has_migrations == 'true'
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}/rest/v1/AuditLog" \
            -H "apikey: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" \
            -H "Accept-Profile: shared" -H "Content-Profile: shared" \
            -H "Content-Type: application/json" \
            -d '{"action":"MIGRATION_APPLIED","entity_type":"Migration","new_values":{"sha":"${{ github.sha }}"}}'

  # ───────────────────────────────────────────────────────────────────────
  # FASE 3 — Build & Deploy
  # ───────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: migrate
    environment:
      name: production
      url: ${{ steps.deploy-prod.outputs.url }}
    outputs:
      url: ${{ steps.deploy-prod.outputs.url }}
      previous_deployment: ${{ steps.previous.outputs.id }}
    # An explicit `if` overrides the default "only run if needs succeeded"
    # behavior, so it's checked here too, not just VERCEL_TOKEN.
    if: ${{ !cancelled() && needs.migrate.result == 'success' && secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Record current production deployment (for rollback)
        id: previous
        run: |
          id=$(vercel ls --token=${{ secrets.VERCEL_TOKEN }} --prod --meta githubCommitRef=main 2>/dev/null | awk 'NR==2{print $1}' || true)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

      - name: Deploy to production
        id: deploy-prod
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────
  # FASE 4 — Smoke tests
  # ───────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    steps:
      - name: Warm-up
        run: sleep 30

      - name: GET /api/health
        run: curl --fail --silent "${{ needs.deploy.outputs.url }}/api/health"

      - name: GET / (home renders)
        run: curl --fail --silent --output /dev/null --write-out "%{http_code}" "${{ needs.deploy.outputs.url }}/" | grep -qE "^(200|307|308)$"

      - name: GET /api/version
        run: curl --fail --silent "${{ needs.deploy.outputs.url }}/api/version" | grep -q "\"commit\""

  # ───────────────────────────────────────────────────────────────────────
  # FASE 5a — Post-deploy: success
  # ───────────────────────────────────────────────────────────────────────
  notify-success:
    name: Notify — Success
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: ${{ needs.deploy.result == 'success' && needs.smoke-test.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Record deploy in audit log
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}/rest/v1/AuditLog" \
            -H "apikey: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" \
            -H "Accept-Profile: shared" -H "Content-Profile: shared" \
            -H "Content-Type: application/json" \
            -d '{"action":"PRODUCTION_DEPLOYED","entity_type":"Deployment","new_values":{"sha":"${{ github.sha }}","url":"${{ needs.deploy.outputs.url }}"}}'

      - name: Comment on commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Deploy de produção concluído**\n\nURL: ${{ needs.deploy.outputs.url }}`
            })

  # ───────────────────────────────────────────────────────────────────────
  # FASE 5b — Post-deploy: failure → automatic rollback
  # ───────────────────────────────────────────────────────────────────────
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.smoke-test.result == 'failure' && needs.deploy.outputs.previous_deployment != '' }}
    steps:
      - name: Rollback to previous deployment
        run: npx vercel@latest rollback "${{ needs.deploy.outputs.previous_deployment }}" --token="${{ secrets.VERCEL_TOKEN }}" --yes

      - name: Record rollback in audit log
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}/rest/v1/AuditLog" \
            -H "apikey: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}" \
            -H "Accept-Profile: shared" -H "Content-Profile: shared" \
            -H "Content-Type: application/json" \
            -d '{"action":"PRODUCTION_ROLLBACK_EXECUTED","entity_type":"Deployment","new_values":{"sha":"${{ github.sha }}","reverted_to":"${{ needs.deploy.outputs.previous_deployment }}","reason":"SMOKE_TEST_FAILURE"}}'

      - name: Comment on commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚨 **Smoke tests falharam — rollback automático executado**\n\nInvestigar antes do próximo deploy.`
            })
