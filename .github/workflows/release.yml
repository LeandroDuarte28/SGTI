name: Release

on:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # semantic-release requires Node ^22.14 || >=24.10 — this job only
          # runs the release CLI, not the app itself (which stays on Node 20
          # per package.json engines), so bumping just this job is safe.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @semantic-release/git commits the changelog itself (chore(release):
          # ...), which includes the full auto-generated release notes as the
          # commit body — that trips this repo's local commit-msg hook
          # (commitlint's body/footer-max-line-length rules, meant for human-
          # authored commits). HUSKY=0 disables husky hooks for this one CI
          # step; local developer commits are unaffected.
          HUSKY: "0"
