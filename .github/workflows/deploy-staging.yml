name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci-full.yml
    secrets: inherit

  migrate:
    name: Apply Migrations → Staging
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: staging
    # No-op (not a failure) until Supabase secrets are configured — see
    # Docs/72_GITHUB_ACTIONS.md and PR #18's description for the full list.
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for new migrations
        id: migration-check
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations/ | grep -q .; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New migration(s) detected for staging:"
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations/
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        if: steps.migration-check.outputs.has_migrations == 'true'
        run: supabase db push --password "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: migrate
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    # An explicit `if` overrides the default "only run if needs succeeded"
    # behavior, so it's checked here too, not just VERCEL_TOKEN.
    if: ${{ !cancelled() && needs.migrate.result == 'success' && secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel staging environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for staging
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

      - name: Deploy to staging
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test — health check
        id: smoke
        run: |
          sleep 10
          curl --fail --silent "${{ steps.deploy.outputs.url }}/api/health" \
            || (echo "::warning::Smoke tests failed in staging — investigate (no auto-revert; staging data may differ from prod)" && exit 1)
