name: Security Scan

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

env:
  NODE_VERSION: "20"

jobs:
  security-scan:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (moderate+, production deps only)
        id: audit
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

      - name: Open issue if npm audit found findings
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security scan: npm audit found vulnerabilities (${new Date().toISOString().slice(0,10)})`,
              body: "`npm audit --audit-level=moderate` failed in the weekly security-scan workflow. See the workflow run logs for details.",
              labels: ["security"]
            })

      - name: gitleaks — full history scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3.29.0
        with:
          languages: javascript-typescript

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3.29.0
        with:
          category: "/language:javascript-typescript"

      - name: Fail job if npm audit found findings
        if: steps.audit.outcome == 'failure'
        run: exit 1
